version: "3.8"

services:
  # --- Base de données ---
  db:
    image: postgres:15-alpine
    # NOM UNIQUE pour éviter le conflit
    container_name: freelance_booking_db_new
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freelance_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
      # Initialise la DB avec ton fichier SQL
      - ./backend/db/00.sql:/docker-entrypoint-initdb.d/00.sql

  # --- Backend (Fastify) ---
  api:
    build: ./backend
    # NOM UNIQUE
    container_name: freelance_booking_api_new
    ports:
      - "3000:3000"
    environment:
      # On utilise le nom du service 'db' ci-dessus
      DATABASE_URL: postgres://postgres:password@db:5432/freelance_booking
      PORT: 3000
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  # --- Frontend (Vite) ---
  web:
    build: .
    # NOM UNIQUE
    container_name: freelance_booking_web_new
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend # On ignore le backend dans le contexte du front

volumes:
  postgres_data_new:
