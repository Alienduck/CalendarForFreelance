# Use postgres/example user/password credentials

services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql
      - ./initdb.d/:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: 123456789
      POSTGRES_USER: root
      POSTGRES_DB: main

volumes:
  pg_data:
    name: "freelance-db"
